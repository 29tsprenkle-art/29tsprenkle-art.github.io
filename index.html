<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function dragstartHandler(ev) {
            ev.dataTransfer.setData("text",id=dragthese);
        }

        function dragoverHandler(ev) {
            ev.preventDefault();
        }

        function dropHandler(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            ev.target.appendChild(document.getElementById(data));
        }

    </script>

    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: lightgreen;
        }

        nav ul {
            display: flex;
            justify-content: space-evenly;
            list-style-type: none;
            padding: 0;
        }

        nav ul li {
            margin: 10px 20px 10px 20px;
            background-color: red;
            padding: 10px;
            border: 5px ridge black;
            border-radius: 10px;
            transition: 0.5s;
        }

        nav ul li:hover {
            background-color: lightskyblue;
            margin: 0px 0px 0px 0px;
            padding: 20px 30px 20px 30px;
            transition: 0.5s;
            cursor: help;

        }

        article {
            background-color: burlywood;
            width: 75%;
            border-width: 5px;
            border-style: dotted;
            border-color: gray;
            border-radius: 10px;
            padding: 10px;
        }
    </style>
</head>

<body>
    <h1>page top header</h1>
    <nav>
        <ul id="dragthese">
            <li><a href="#">link</a></li>
            <li><a href="#">link</a></li>
            <li><a href="#">link</a></li>
            <li><a href="#">link</a></li>
            <li><a href="#">link</a></li>
        </ul>
    </nav>
    <article>
        <h2>article title.</h2>
        <p>some text.</p>
    </article>
    <footer>
        &copy; 2026
    </footer>
</body>

</html>
